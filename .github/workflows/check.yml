name: Offline verification
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
      - run: python -m pip install -r requirements-site.txt
      - run: python tools/check.py
