<svg class="flow-diagram" xmlns="http://www.w3.org/2000/svg" width="480" height="544" viewBox="0 0 480 544" role="img" aria-labelledby="title desc"><title id="title">从证据到建议，再由人决定采用</title><desc id="desc">公开或合成输入进入 baseline 或 provider profile，得到记录和校验，交给人检查。最后的人类反馈属于接入设计，生产执行不在本仓库内。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10" fill="none" stroke="var(--accent,#2855bd)" stroke-width="1.5"/></marker></defs><rect width="480" height="544" rx="0" fill="var(--panel,#e7eef2)"/><g fill="var(--white,#fff)" stroke="var(--line,#aac2d4)"><rect x="40" y="50" width="400" height="82" rx="0"/><rect x="40" y="168" width="400" height="82" rx="0"/><rect x="40" y="286" width="400" height="82" rx="0"/><rect x="40" y="404" width="400" height="82" rx="0"/></g><g font-family="system-ui,sans-serif" fill="var(--ink,#202d38)"><text x="40" y="28" font-size="12" letter-spacing="2" fill="var(--accent,#2855bd)">DECISIONS LAB / ADOPTION BOUNDARY</text><g font-size="22"><text x="60" y="84">文档 + 任务上下文</text><text x="60" y="202">baseline / provider profile</text><text x="60" y="320">记录 → 校验 → 回放</text><text x="60" y="438">人检查与选择</text></g><g font-size="17" fill="var(--muted,#577180)"><text x="60" y="113">公开 / 原创合成</text><text x="60" y="231">只返回建议</text><text x="60" y="349">保留错误与 unknown</text><text x="60" y="467">后续接入设计，尚未接入生产系统</text><text x="40" y="521">执行与权限由接入方负责。</text></g></g><g stroke="var(--accent,#2855bd)" stroke-width="2" fill="none" marker-end="url(#arrow)"><path d="M240 132V158"/><path d="M240 250V276"/><path d="M240 368V394"/></g></svg>
